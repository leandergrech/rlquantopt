site_name: RLQuantOpt v2 (JAX)
site_description: JAX re-implementation of RLQuantOpt, replication of Grech et al. (2026) and the work that follows it.
site_url: https://leandergrech.github.io/rlquantopt/
repo_url: https://github.com/leandergrech/rlquantopt
repo_name: leandergrech/rlquantopt
edit_uri: edit/main/docs/
copyright: "MIT licence. Paper: Grech et al., Quantum Sci. Technol. 11, 015030 (2026)."

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  font:
    text: Source Serif 4
    code: JetBrains Mono
  features:
    - announce.dismiss
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Collaborate: contact.md
  - Guide:
      - Working together: working-together.md
      - Getting started: getting-started.md
  - The system:
      - Model and simulator: system/model.md
      - Gate metrics: system/metrics.md
      - Hardware drift ranges: system/drift.md
  - The code:
      - Architecture: code/architecture.md
      - Environment: code/environment.md
      - Agents and training: code/agents.md
      - GRAPE: code/grape.md
      - Scripts and CLI: code/scripts.md
  - Results:
      - Replication of the paper: results/replication.md
      - Training RL agents: results/training.md
      - Robustness to hardware drift: results/robustness.md
      - Measurable observations and gate fidelity: results/measurable.md
  - Research question:
      - Drift, dimension and learned policies: hypothesis/drift-and-dimension.md
      - RL-initialised optimal control: hypothesis/rl-initialised-qoc.md
  - Next steps:
      - Open decisions: next/decisions.md
      - Named gates and a richer model: next/named-gates.md
      - Beyond two transmons: next/platforms.md
      - Roadmap: next/roadmap.md
  - Working ideas:
      - 🐾: ideas/index.md
      - 🐸: ideas/axolotl.md
      - 🦡: ideas/badger.md
      - 🐲: ideas/chameleon.md
      - 🦋: ideas/dragonfly.md
      - 🦔: ideas/echidna.md
      - 🦊: ideas/fox.md
      - 🦎: ideas/gecko.md
      - 🦄: ideas/hippogriff.md
      - 🦩: ideas/ibis.md
  - Bibliography: bibliography.md
  - Changelog: changelog.md

plugins:
  - search
  # click any figure to open it full screen, with zoom (wheel, pinch) and pan
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true
      skip_classes: [no-lightbox]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
