site_name: RLQuantOpt v2 (JAX)
site_description: JAX re-implementation of RLQuantOpt, replication of Grech et al. (2026) and the work that follows it.
site_url: https://leandergrech.github.io/rlquantopt/
repo_url: https://github.com/leandergrech/rlquantopt
repo_name: leandergrech/rlquantopt
edit_uri: edit/main/docs/
copyright: "MIT licence. Paper: Grech et al., Quantum Sci. Technol. 11, 015030 (2026)."

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  features:
    - announce.dismiss
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Working together: working-together.md
  - Getting started: getting-started.md
  - Code walkthrough:
      - Architecture: architecture.md
      - Physics: code/physics.md
      - Gate metrics: code/metrics.md
      - Environment: code/environment.md
      - Agents and training: code/agents.md
      - GRAPE: code/grape.md
  - Experiments:
      - Replication of the paper: replication.md
      - RL vs GRAPE vs robust GRAPE: experiments/rl-grape-robust.md
  - Roadmap: v2_jax_plan.md
  - Reference:
      - Scripts and CLI: reference/scripts.md
      - Changelog: changelog.md
  - Collaborate: contact.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
