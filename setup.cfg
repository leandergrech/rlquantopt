[metadata]
name = rlquantopt
version = 2.14.0
description = RLQuantOpt - Optimising quantum gate fidelity with Reinforcement Learning
;long_description = file: wiki/Home.md
;long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Leander Grech
author_email = leander.grech@um.edu.mt
url = https://github.com/leandergrech/rlquantopt
maintainers =
    'Leander Grech <leander.grech@um.edu.mt>'
;    'Mirko Consiglio <mirko.consiglio@um.edu.mt>'

[options]
packages=find:
zip_safe = True
include_package_data = True
install_requires =
    setuptools
    numpy==1.24.2
    pandas==2.1.4
    matplotlib
    tqdm
    torch==2.1.2
    PyYAML
    qutip==5.0.2
    qutip-qip==0.3.1
    qutip-qtrl==0.1.1
    krotov
    gymnasium==0.29.1
    stable-baselines3==2.3.1
    sb3-contrib==2.3.0
    tensorboard
    weylchamber
;    qutip==4.7.5
;    qutip-qip
;    qutip-qtrl
;    ffmpeg

;[options.entry_points]
console_scripts =
    zcqpee-train = rlquantopt.rl_agents.train_zcqpee_sb3:main
    zcqpee-eval = rlquantopt.rl_agents.eval_zcqpee_sb3:main